name: iOS Build (Secrets p12, No Login)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: ios-secrets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-upload:
    name: Sign with Secrets and Upload TestFlight
    # App Store 上传要求 iOS 26 SDK（Xcode 26+）；macos-14 仅含 Xcode 16.x
    runs-on: macos-26
    timeout-minutes: 90

    env:
      IOS_PROJECT_DIR: "."
      SCHEME_NAME: HQITwoFncesd
      DEVELOPMENT_TEAM: VSTPZ2K43F
      # CocoaPods 生成的工作区名，与 Podfile 里 target 名一致
      WORKSPACE_NAME: HQITwoFncesd.xcworkspace
      # 与 Xcode → Build Settings 一致（Manual 签名）
      BUNDLE_ID:  com.emoteleasing.main.disreda
      PROVISIONING_PROFILE_SPECIFIER: emoteleasingdis
      CI: true
      COCOAPODS_DISABLE_STATS: true

    defaults:
      run:
        working-directory: ${{ env.IOS_PROJECT_DIR }}

    steps:
      - name: Checkout 源码
        uses: actions/checkout@v4

      - name: 选择 Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          # 须 ≥ 26.2（含 iOS 26 SDK），否则上传 TestFlight 会报 SDK version issue
          xcode-version: "26.2"

      - name: 确认 Xcode / SDK 版本
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -E 'iphoneos|iOS' || true

      - name: 从 Secrets 安装签名证书与描述文件
        working-directory: ${{ github.workspace }}
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # 后续 xcodebuild / gym 必须使用此钥匙串（否则会找不到 Distribution 证书）
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

          echo "=== 临时钥匙串中的签名身份（供对照）==="
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" || true
          if security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -q "Apple Distribution"; then
            echo "CODE_SIGN_IDENTITY=Apple Distribution" >> "$GITHUB_ENV"
            echo "检测到 CODE_SIGN_IDENTITY=Apple Distribution"
          elif security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -q "iPhone Distribution"; then
            echo "CODE_SIGN_IDENTITY=iPhone Distribution" >> "$GITHUB_ENV"
            echo "检测到 CODE_SIGN_IDENTITY=iPhone Distribution"
          fi

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          PLIST=$RUNNER_TEMP/profile.plist
          security cms -D -i "$PP_PATH" > "$PLIST"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" "$PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print Name" "$PLIST")
          APP_ID=$(/usr/libexec/PlistBuddy -c "Print Entitlements:application-identifier" "$PLIST" 2>/dev/null || echo "unknown")
          cp "$PP_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"
          echo "描述文件 Name: $PROFILE_NAME"
          echo "描述文件 UUID: $PROFILE_UUID"
          echo "application-identifier: $APP_ID"
          echo "期望 PROVISIONING_PROFILE_SPECIFIER=${{ env.PROVISIONING_PROFILE_SPECIFIER }}"

      - name: 安装 Ruby 依赖（fastlane）
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: ${{ env.IOS_PROJECT_DIR }}

      - name: 安装 CocoaPods 依赖
        working-directory: ${{ env.IOS_PROJECT_DIR }}
        run: |
          gem install cocoapods
          pod install --repo-update
          echo "=== pod install 后检查 ==="
          ls -la *.xcworkspace *.xcodeproj 2>/dev/null || ls -la

      - name: 列出 Schemes（核对 SCHEME_NAME）
        working-directory: ${{ env.IOS_PROJECT_DIR }}
        run: |
          xcodebuild -list -workspace "${{ env.WORKSPACE_NAME }}" || xcodebuild -list

      - name: 诊断签名与试 Archive（失败时看此步日志）
        working-directory: ${{ env.IOS_PROJECT_DIR }}
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -e
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "=== 默认钥匙串 ==="
          security list-keychains
          echo "=== 可用签名证书 ==="
          security find-identity -v -p codesigning || true
          echo "=== 已安装描述文件 ==="
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/ || true
          echo "=== 试 Archive（与 gym 相同配置）==="
          set +e
          xcodebuild archive \
            -workspace "${{ env.WORKSPACE_NAME }}" \
            -scheme "${{ env.SCHEME_NAME }}" \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/${{ env.SCHEME_NAME }}.xcarchive" \
            DEVELOPMENT_TEAM="${{ env.DEVELOPMENT_TEAM }}" \
            "OTHER_CODE_SIGN_FLAGS=--keychain $KEYCHAIN_PATH" \
            | tee "$RUNNER_TEMP/xcodebuild-archive.log"
          XCODE_EXIT=$?
          echo "xcodebuild exit code: $XCODE_EXIT"
          if [ "$XCODE_EXIT" -ne 0 ]; then
            echo "=== 日志最后 80 行 ==="
            tail -80 "$RUNNER_TEMP/xcodebuild-archive.log"
            exit 1
          fi

      - name: 校验 Archive 内主 App 的 PrivacyInfo
        working-directory: ${{ env.IOS_PROJECT_DIR }}
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/${{ env.SCHEME_NAME }}.xcarchive/Products/Applications/${{ env.SCHEME_NAME }}.app"
          if [ ! -f "$APP/PrivacyInfo.xcprivacy" ]; then
            echo "::error::${{ env.SCHEME_NAME }}.app 内缺少 PrivacyInfo.xcprivacy"
            find "$RUNNER_TEMP/${{ env.SCHEME_NAME }}.xcarchive" -name "PrivacyInfo.xcprivacy" -print || true
            exit 1
          fi
          echo "OK: $APP/PrivacyInfo.xcprivacy"
          /usr/bin/plutil -lint "$APP/PrivacyInfo.xcprivacy"

      - name: fastlane 构建并上传（无 match、无登录）
        working-directory: ${{ env.IOS_PROJECT_DIR }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          DEVELOPMENT_TEAM: ${{ env.DEVELOPMENT_TEAM }}
          SCHEME_NAME: ${{ env.SCHEME_NAME }}
          WORKSPACE_NAME: ${{ env.WORKSPACE_NAME }}
          BUNDLE_ID: ${{ env.BUNDLE_ID }}
          PROVISIONING_PROFILE_SPECIFIER: ${{ env.PROVISIONING_PROFILE_SPECIFIER }}
          KEYCHAIN_PATH: ${{ env.KEYCHAIN_PATH }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          CODE_SIGN_IDENTITY: ${{ env.CODE_SIGN_IDENTITY }}
        run: |
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          bundle exec fastlane beta_no_match --verbose 2>&1 | tee fastlane.log
          EXIT=${PIPESTATUS[0]}
          if [ "$EXIT" -ne 0 ]; then
            echo "=== gym 日志末尾 ==="
            tail -150 ~/Library/Logs/gym/*${{ env.SCHEME_NAME }}*.log 2>/dev/null || true
            exit "$EXIT"
          fi

      - name: 上传构建日志（失败时下载排查）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs
          path: |
            ~/Library/Logs/gym/
            ${{ env.IOS_PROJECT_DIR }}/fastlane.log
          if-no-files-found: ignore

      - name: 清理临时钥匙串
        if: always()
        working-directory: ${{ github.workspace }}
        run: security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
